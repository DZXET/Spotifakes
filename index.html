<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Style Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay" id="overlay"></div>
<!-- Sidebar Playlist -->
<div class="sidebar" id="sidebar">
    <h3>Playlist</h3>
    <div id="playlist"></div>
</div>
<div class="player">
    <!-- Top buttons -->
    <button class="mode-toggle" id="modeBtn">
        <img id="modeIcon" src="https://cdn-icons-png.flaticon.com/512/6714/6714978.png" alt="mode">
    </button>
    <button class="playlist-toggle" id="togglePlaylist">☰</button>
    <!-- Disc -->
    <div class="cover-wrap">
        <div class="cover" id="cover"></div>
    </div>
    <!-- Song info -->
    <div class="song-info">
        <h3 id="title">Song Title</h3>
        <p id="artist">Artist Name</p>
    </div>
    <!-- Audio -->
    <audio id="audio"></audio>
    <!-- Waveform -->
    <div class="wave-container">
        <canvas id="wave" width="300" height="60"></canvas>
    </div>
    <!-- Progress -->
    <div class="progress-container">
        <div class="progress" id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>
    <!-- Controls -->
    <div class="controls">
        <button class="btn" id="prev">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/>
            </svg>
        </button>
        <button class="play" id="play">
            <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
        </button>
        <button class="btn" id="next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/>
            </svg>
        </button>
    </div>
    <!-- Volume -->
    <div class="volume">
        <img id="volumeIcon" src="https://pngimg.com/d/sound_PNG20.png" alt="volume">
        <input type="range" min="0" max="1" step="0.01" value="1" id="volume">
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
