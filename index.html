<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Style Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Open Graph Meta Tags (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="Spotifake Music Player">
    <meta property="og:description" content="spotifake musisc player, free for anime opening/ending/theme music and other.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://media.discordapp.net/attachments/1200456272256970833/1465676427864047788/Spotifake.png?ex=6979f90b&is=6978a78b&hm=df1ad8e9d5bdb0aa3ed377e25a3ee43c4da3a34d80e60b34fe4dde27b7e6a553&=&format=webp&quality=lossless&width=1080&height=567">
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Spotifake Music Player">
    <meta name="twitter:description" content="spotifake musisc player, opening/ending/theme music with dark/light mode, playlist management, favorites, and a spinning vinyl disc animation.">
    <meta name="twitter:image" content="https://media.discordapp.net/attachments/1200456272256970833/1465676427864047788/Spotifake.png?ex=6979f90b&is=6978a78b&hm=df1ad8e9d5bdb0aa3ed377e25a3ee43c4da3a34d80e60b34fe4dde27b7e6a553&=&format=webp&quality=lossless&width=1080&height=567">
    
    <!-- Additional Meta Tags -->
    <meta name="description" content="spotifake musisc player, opening/ending/theme music with dark/light mode, playlist management, favorites, and a spinning vinyl disc animation.">
    <meta name="keywords" content="music player, spotify, web player, audio player, playlist, javascript, animesong">
    <meta name="author" content="DZXET">
</head>
<body>
<div class="bg" id="bg"></div>
<div class="overlay" id="overlay"></div>
<!-- Sidebar Playlist -->
<div class="sidebar" id="sidebar">
    <h3>Playlist</h3>
    <div class="search-container">
        <img class="search-icon" src="https://cdn-icons-png.freepik.com/512/68/68213.png" alt="search">
        <input type="text" id="searchInput" placeholder="Search songs or artists..." class="search-input">
        <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" style="display: none;">✕</button>
    </div>
    <div id="playlist"></div>
</div>
<div class="player">
    <!-- Top buttons -->
    <button class="mode-toggle" id="modeBtn">
        <img id="modeIcon" src="https://cdn-icons-png.flaticon.com/512/6714/6714978.png" alt="mode">
    </button>
    <button class="playlist-toggle" id="togglePlaylist">☰</button>
    <!-- Disc -->
    <div class="cover-wrap">
        <div class="cover" id="cover"></div>
    </div>
    <!-- Song info -->
    <div class="song-info">
        <div class="song-title-row">
            <h3 id="title">Song Title</h3>
            <button class="btn-favourite-inline" id="favouriteBtn" title="Add to Favourites">
                <svg class="heart-outline" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
                <svg class="heart-filled" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
                </svg>
            </button>
        </div>
        <p id="artist">Artist Name</p>
    </div>
    <!-- Audio -->
    <audio id="audio"></audio>
    <!-- Waveform -->
    <div class="wave-container">
        <canvas id="wave" width="300" height="60"></canvas>
    </div>
    <!-- Progress -->
    <div class="progress-container">
        <div class="progress" id="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="time">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>
    <!-- Controls -->
    <div class="controls">
        <button class="btn" id="prev">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/>
            </svg>
        </button>
        <button class="play" id="play">
            <svg class="play-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg class="pause-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
            </svg>
        </button>
        <button class="btn" id="next">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M16 18h2V6h-2v12zM6 18l8.5-6L6 6v12z"/>
            </svg>
        </button>
    </div>
    <!-- Volume -->
    <div class="volume">
        <img id="volumeIcon" src="https://pngimg.com/d/sound_PNG20.png" alt="volume">
        <input type="range" min="0" max="1" step="0.01" value="1" id="volume">
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
